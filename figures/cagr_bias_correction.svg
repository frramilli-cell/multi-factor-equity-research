<text x="54" y="420" class="axis">0%</text><text x="45" y="350" class="axis">5%</text><text x="39" y="280" class="axis">10%</text><text x="39" y="210" class="axis">15%</text><text x="39" y="140" class="axis">20%</text><text x="39" y="105" class="axis">25%</text>
