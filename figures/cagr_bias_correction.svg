<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<rect width="1200" height="720" fill="white"/>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#111}.title{font-size:34px;font-weight:700}.sub{font-size:17px;fill:#555}.label{font-size:20px}.value{font-size:27px;font-weight:700}.axis{font-size:15px;fill:#666}.grid{stroke:#e8e8e8;stroke-width:1}.bar1{fill:#8f8f8f}.bar2{fill:#202020}.bar3{fill:#b8b8b8}.note{font-size:16px;fill:#555}
</style>
<text x="105" y="70" class="title">CAGR Before and After the Historical-Universe Correction</text>
<text x="105" y="105" class="sub">Same four-factor specification; only the historical investment universe was changed</text>

<!-- chart area -->
<line x1="125" y1="560" x2="1080" y2="560" stroke="#222" stroke-width="1.2"/>
<line x1="125" y1="472" x2="1080" y2="472" class="grid"/>
<line x1="125" y1="384" x2="1080" y2="384" class="grid"/>
<line x1="125" y1="296" x2="1080" y2="296" class="grid"/>
<line x1="125" y1="208" x2="1080" y2="208" class="grid"/>
<line x1="125" y1="120" x2="1080" y2="120" class="grid"/>

<text x="78" y="565" class="axis">0%</text>
<text x="70" y="477" class="axis">5%</text>
<text x="62" y="389" class="axis">10%</text>
<text x="62" y="301" class="axis">15%</text>
<text x="62" y="213" class="axis">20%</text>
<text x="62" y="125" class="axis">25%</text>

<!-- bars: scale 25% = 440 px -->
<rect x="215" y="132" width="190" height="428" rx="2" class="bar1"/>
<rect x="505" y="302" width="190" height="258" rx="2" class="bar2"/>
<rect x="795" y="219" width="190" height="341" rx="2" class="bar3"/>

<!-- labels above bars -->
<text x="310" y="112" class="value" text-anchor="middle">24.32%</text>
<text x="600" y="282" class="value" text-anchor="middle">14.63%</text>
<text x="890" y="199" class="value" text-anchor="middle">19.39%</text>

<!-- category labels -->
<text x="310" y="600" class="label" text-anchor="middle">Original V2</text>
<text x="600" y="600" class="label" text-anchor="middle">Historical V2</text>
<text x="890" y="600" class="label" text-anchor="middle">SPY</text>

<line x1="400" y1="646" x2="800" y2="646" stroke="#d7d7d7" stroke-width="1"/>
<text x="600" y="680" class="note" text-anchor="middle">Historical-universe correction reduced V2 CAGR by 9.69 percentage points</text>
</svg>