[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-factor-equity-research"
version = "0.1.0"
description = "Point-in-time multi-factor equity research and backtesting framework."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Fiona Rramilli"}]
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "scipy>=1.13,<2",
  "matplotlib>=3.9,<4",
  "statsmodels>=0.14,<1",
  "scikit-learn>=1.5,<2",
  "pyarrow>=17,<20",
  "requests>=2.31,<3",
  "yfinance>=0.2.54,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "jupyter>=1,<2"]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
